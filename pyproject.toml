[project]
name = "verigym"
version = "0.1.0"
description = "A library for exploring MDPs"
readme = "README.md"
authors = [
    { name = "julemarie"},
    { name = "joshuawe"},
    { name = "MKrale"},
    { name = "marisgg"}, 
    { name = "njansen123" },
    { name = "Ossmos"}
]
requires-python = ">=3.12.2"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium[mujoco]>=1.4.0",
    # Box2D has wheels only up to Python 3.13; on 3.14 it needs swig to compile (see README)
    "gymnasium[box2d]>=1.4.0; python_version < '3.14'",
    "numba>=0.66.0",
    "scipy>=1.16.3",
    "stormpy>=1.11.3",
    "tqdm>=4.67.3",
    "z3-solver>=4.12.0.0",
]

[project.urls]
Homepage = "https://github.com/ai-fm/VeriGym"
Documentation = "https://ai-fm.github.io/VeriGym/"
Repository = "https://github.com/ai-fm/VeriGym"
Issues = "https://github.com/ai-fm/VeriGym/issues"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".ipynb_checkpoints",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "buck-out",
    "build",
    "dist",
    "site-packages",
    ".venv",
    "examples/"
]
line-length = 88
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []

fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "gymnasium[box2d]>=1.4.0",  # tests use LunarLander; on 3.14 uv builds it via extra-build-dependencies
    "pytest>=9.0.1",
    "pytest-pretty>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "diff-cover>=10.2.0",
    "stable-baselines3>=2.7.1",
    "torch>=2.0.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.11.1",
]
docs = [
    "mkdocs-material>=9.7.0",
    "mkdocstrings-python>=1.19.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Add coverage
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=verigym --cov-report= --cov-fail-under=70"

[tool.coverage.run]
source = ["verigym"]
branch = true
concurrency = ["multiprocessing"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = true
omit = ["tests/*"]

# box2d-py (gymnasium[box2d] on Python 3.14) builds from source and needs swig at build time
[tool.uv.extra-build-dependencies]
box2d-py = ["swig"]
