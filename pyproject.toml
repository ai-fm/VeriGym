[project]
name = "verigym"
version = "0.1.0"
description = "A library for exploring MDPs"
readme = "README.md"
authors = [
    { name = "julemarie"},
    { name = "joshuawe"},
    { name = "MKrale"},
    { name = "marisgg"}, 
    { name = "njansen123" },
    { name = "Ossmos"}
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.2.2",
    "scipy>=1.16.3",
    "stormpy>=1.11.3",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".ipynb_checkpoints",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "buck-out",
    "build",
    "dist",
    "site-packages",
    ".venv",
]
line-length = 88
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []

fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-pretty>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "diff-cover>=10.2.0",
]
docs = [
    "mkdocs-material>=9.7.0",
    "mkdocstrings-python>=1.19.0",
]

# Add coverage
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=verigym --cov-report= --cov-fail-under=70"

[tool.coverage.run]
source = ["verigym"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
omit = ["tests/*"]
