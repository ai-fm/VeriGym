name: Docker image
# Builds the image from docker/Dockerfile for one commit and offers it as a downloadable artifact:
#   - amd64 / arm64:  verigym-<arch>.tar.gz, load it with ./docker/run-docker.sh load FILE
#   - multi-platform: both of the above, plus verigym-multi.oci.tar (one OCI archive with both
#                     platforms, e.g. to push to a registry)
# Each platform is built natively (ubuntu-24.04 / ubuntu-24.04-arm), tested, and then saved.
# Start it from the Actions tab -> Docker image -> Run workflow (pick the branch and flavour).
on:
  workflow_dispatch:
    inputs:
      flavour:
        description: Platform(s) to build
        type: choice
        options: [multi-platform, amd64, arm64]
        default: multi-platform
      prism:
        description: Also install Java and PRISM
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    # multi-platform builds both architectures; otherwise only the chosen one
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.flavour == 'multi-platform' && '["amd64", "arm64"]' || format('["{0}"]', inputs.flavour)) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # The image (~6 GB), its build cache and the archive need more than the runner's free space
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Default UID/GID 1000, as documented for prebuilt images (not the runner's UID)
      - name: Build the image
        run: docker build -f docker/Dockerfile -t localhost/verigym --build-arg INSTALL_PRISM=${{ inputs.prism }} .

      # On the repository copy inside the image, with the flags of test.yml
      - name: Test the image
        run: docker run --rm localhost/verigym bash -c 'pytest -n 2 --timeout 120 && julia tests/julia/test_pomdps_umb.jl'

      - name: Save the image
        run: ./docker/run-docker.sh save

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: verigym-${{ matrix.arch }}${{ inputs.prism && '-prism' || '' }}-${{ github.sha }}
          path: verigym-${{ matrix.arch }}.tar.gz
          compression-level: 0  # already gzip-compressed
          if-no-files-found: error

  multi-platform:
    name: Combine into a multi-platform image
    needs: build
    if: inputs.flavour == 'multi-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Download the per-platform images
        uses: actions/download-artifact@v4
        with:
          pattern: verigym-*
          merge-multiple: true

      # Podman (preinstalled on the runner) builds the image index from both archives, without a registry
      - name: Combine the images
        run: |
          gunzip verigym-amd64.tar.gz verigym-arm64.tar.gz
          podman manifest create localhost/verigym:latest
          podman manifest add localhost/verigym:latest docker-archive:verigym-amd64.tar
          podman manifest add localhost/verigym:latest docker-archive:verigym-arm64.tar
          podman manifest push --all localhost/verigym:latest oci-archive:verigym-multi.oci.tar:localhost/verigym:latest

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: verigym-multi${{ inputs.prism && '-prism' || '' }}-${{ github.sha }}
          path: verigym-multi.oci.tar
          compression-level: 0  # layers are already compressed
          if-no-files-found: error
