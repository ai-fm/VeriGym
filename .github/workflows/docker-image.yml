name: Docker image
# Builds the image from docker/Dockerfile for one commit and offers it as a downloadable artifact:
#   - amd64 / arm64:  verigym-<arch>.tar.gz, load it with docker load -i FILE
#   - multi-platform: both of the above; with publish, also one image for both platforms in the
#                     registry: ghcr.io/<owner>/verigym:<commit>[-prism]
# Each platform is built natively (ubuntu-24.04 / ubuntu-24.04-arm), tested, and then saved.
# Start it from the Actions tab -> Docker image -> Run workflow (pick the branch and flavour).
on:
  workflow_dispatch:
    inputs:
      flavour:
        description: Platform(s) to build
        type: choice
        options: [multi-platform, amd64, arm64]
        default: multi-platform
      prism:
        description: Also install Java and PRISM
        type: boolean
        default: false
      publish:
        description: "multi-platform only: push it to ghcr.io/<owner>/verigym:<commit>"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    # multi-platform builds both architectures; otherwise only the chosen one
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.flavour == 'multi-platform' && '["amd64", "arm64"]' || format('["{0}"]', inputs.flavour)) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # The image, its build cache and the archive need more than the runner's free space
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Default UID/GID 1000, as documented for prebuilt images (not the runner's UID).
      # The labels record the commit and link a published image (ghcr.io) to this repository.
      # Julia is required for the tests.
      - name: Build the image
        run: >-
          docker build -f docker/Dockerfile -t localhost/verigym
          --build-arg INSTALL_PRISM=${{ inputs.prism }}
          --build-arg INSTALL_JULIA=true
          --label org.opencontainers.image.revision=${{ github.sha }}
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} .

      # The image's own test command (on the code built into it), with the flags of test.yml
      - name: Test the image
        run: docker run --rm localhost/verigym test -n 2 --timeout 120

      - name: Save the image
        run: ./docker/run-docker.sh save

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: verigym-${{ matrix.arch }}${{ inputs.prism && '-prism' || '' }}-${{ github.sha }}
          path: verigym-${{ matrix.arch }}.tar.gz
          compression-level: 0  # already gzip-compressed
          if-no-files-found: error

  publish:
    name: Publish the multi-platform image
    needs: build
    if: inputs.flavour == 'multi-platform' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write  # push to ghcr.io
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Download the per-platform images
        uses: actions/download-artifact@v4
        with:
          pattern: verigym-*
          merge-multiple: true

      # Podman (preinstalled on the runner) combines both archives into one multi-platform image.
      # Registry names must be lowercase, hence ${...,,} for the owner.
      - name: Push the multi-platform image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/verigym:${GITHUB_SHA}${{ inputs.prism && '-prism' || '' }}"
          echo "$GHCR_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gunzip verigym-amd64.tar.gz verigym-arm64.tar.gz
          podman manifest create localhost/verigym:latest
          podman manifest add localhost/verigym:latest docker-archive:verigym-amd64.tar
          podman manifest add localhost/verigym:latest docker-archive:verigym-arm64.tar
          podman manifest push --all localhost/verigym:latest "docker://$image"
          echo "Pushed \`$image\`; get it with \`docker pull $image\`" >> "$GITHUB_STEP_SUMMARY"
