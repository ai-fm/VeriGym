name: Publish (PyPI / TestPyPI)
# Builds the sdist + wheel with uv and uploads them:
#   - to PyPI when a GitHub release is published
#   - to TestPyPI as a test upload (Actions -> Publish (PyPI / TestPyPI) -> Run workflow), with
#     version X.Y.Z.devN (N = run number), so test uploads never use up the real version number
# Uses Trusted Publishing (OIDC): no API token is stored in GitHub.
# Requires trusted publishers on PyPI (environment "pypi") and TestPyPI (environment "testpypi"),
# both for workflow publish.yml, and GitHub environments with these names.
run-name: >-
  ${{ github.event_name == 'release'
      && format('Publish {0} to PyPI', github.event.release.tag_name)
      || format('Test upload to TestPyPI from {0}', github.ref_name) }}
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"

      # PyPI versions are immutable, so refuse to publish if tag (v0.1.0 or 0.1.0) and pyproject disagree
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          VERSION="$(uv version --short)"
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Set unique dev version for the TestPyPI upload
        if: github.event_name == 'workflow_dispatch'
        run: uv version "$(uv version --short).dev${GITHUB_RUN_NUMBER}" --frozen

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the wheel
        run: uv run --isolated --no-project --python ">=3.12.2,<3.13" --with dist/*.whl python -c "import verigym"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Upload to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/verigym/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Upload to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/project/verigym/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
