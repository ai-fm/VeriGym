name: Publish to PyPI
# Builds the sdist + wheel with uv and uploads them to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in GitHub.
# Requires a trusted publisher on PyPI (workflow publish.yml, environment "pypi")
# and a GitHub environment named "pypi".
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"

      # PyPI versions are immutable, so refuse to publish if tag (v0.1.0 or 0.1.0) and pyproject disagree
      - name: Check release tag matches package version
        run: |
          VERSION="$(uv version --short)"
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the wheel
        run: uv run --isolated --no-project --python ">=3.12.2,<3.13" --with dist/*.whl python -c "import verigym"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/verigym/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
