name: docs
on: 
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"
      - name: Build the documentation
        run: uv run --group docs sphinx-build docs docs/_build/html
      # Pushes the built site to the gh-pages branch; -n adds .nojekyll, so GitHub serves Sphinx's _static folder
      - name: Publish to GitHub Pages
        run: uv run --group docs ghp-import -n -p -f docs/_build/html
